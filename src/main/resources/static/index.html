<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMAA – Barcarena</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login" class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">🌿</div>
            <h1>PMAA</h1>
            <p>Programa Municipal de Aquisição de Alimentos</p>
            <small>Prefeitura de Barcarena – PA</small>
        </div>
        <form id="form-login" onsubmit="fazerLogin(event)">
            <div class="campo">
                <label>Login</label>
                <input type="text" id="input-login" placeholder="Seu login" required autocomplete="username">
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="input-senha" placeholder="Sua senha" required autocomplete="current-password">
            </div>
            <div id="login-erro" class="erro-msg" style="display:none"></div>
            <button type="submit" class="btn-primary btn-block" id="btn-login">Entrar</button>
        </form>
    </div>
</div>

<!-- APP (após login) -->
<div id="app" style="display:none">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>🌿</span>
            <span>PMAA</span>
        </div>
        <nav id="nav-menu">
            <a href="#" class="nav-item" data-pagina="dashboard" onclick="navegar('dashboard');return false;">📊 Dashboard</a>
            <a href="#" class="nav-item" data-pagina="agricultores" onclick="navegar('agricultores');return false;">👨‍🌾 Agricultores</a>
            <a href="#" class="nav-item" data-pagina="produtos" onclick="navegar('produtos');return false;">🥦 Produtos</a>
            <a href="#" class="nav-item" data-pagina="beneficiarios" onclick="navegar('beneficiarios');return false;">🏛️ Beneficiários</a>
            <a href="#" class="nav-item" data-pagina="entregas-agricultor" onclick="navegar('entregas-agricultor');return false;">📦 Entregas Agricultores</a>
            <a href="#" class="nav-item" data-pagina="entregas-cesta" onclick="navegar('entregas-cesta');return false;">🧺 Entregas Cestas</a>
            <div id="nav-admin" style="display:none">
                <div class="nav-divider">Administração</div>
                <a href="#" class="nav-item" data-pagina="pagamentos" onclick="navegar('pagamentos');return false;">💰 Pagamentos</a>
                <a href="#" class="nav-item" data-pagina="funcionarios" onclick="navegar('funcionarios');return false;">👥 Funcionários</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div id="sidebar-usuario"></div>
            <button onclick="sair()" class="btn-sair">Sair</button>
        </div>
    </aside>

    <main class="main-content">
        <div id="conteudo-pagina"></div>
    </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/agricultores.js"></script>
<script src="/js/produtos.js"></script>
<script src="/js/beneficiarios.js"></script>
<script src="/js/entregas-agricultor.js"></script>
<script src="/js/entregas-cesta.js"></script>
<script src="/js/pagamentos.js"></script>
<script src="/js/funcionarios.js"></script>
</body>
</html>
