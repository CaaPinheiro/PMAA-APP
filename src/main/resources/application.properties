spring.application.name=pmaa

# PostgreSQL
# Credenciais vem de variaveis de ambiente. Os valores apos ":" sao apenas
# fallback para desenvolvimento local. Em producao, defina as variaveis.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pmaa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - cria/atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT
# NUNCA versionar a chave real. Defina JWT_SECRET no ambiente de producao.
# O fallback abaixo serve apenas para rodar localmente.
jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-local-nao-usar-em-producao}
jwt.expiration=${JWT_EXPIRATION:86400000}
