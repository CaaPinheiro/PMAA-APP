spring.application.name=Integra PMAA

# =====================================================================
#  BANCO DE DADOS: H2 embutido
#  Nao precisa instalar nada. O banco e criado automaticamente na
#  pasta "data" na primeira execucao. Backup = copiar a pasta "data".
# =====================================================================
# O H2 2.x recusa AUTO_SERVER=TRUE junto com DB_CLOSE_ON_EXIT=FALSE.
# Como este e um sistema de uso local, AUTO_SERVER nao e necessario.
spring.datasource.url=jdbc:h2:file:./data/integrapmaa;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console do banco DESLIGADO por seguranca. Ele abre o banco inteiro
# (CPFs, senhas, pagamentos) para quem alcancar o endereco, sem login.
# Ligue apenas em desenvolvimento, e desligue de novo depois.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

server.port=8080
# Aceita conexao apenas desta maquina. Remova esta linha se um dia o
# sistema precisar ser acessado por outros computadores da rede - mas
# nesse caso leia antes a secao de seguranca do README.
server.address=127.0.0.1

# Abre o navegador automaticamente ao iniciar
app.abrir-navegador=true

# O Spring Boot liga o modo headless por padrao, e nesse modo o Java se
# recusa a abrir o navegador. Como este e um sistema de uso local, desligamos.
spring.main.headless=false

# JWT - troque a chave em producao
jwt.secret=integra-pmaa-barcarena-chave-secreta-trocar-obrigatoriamente-em-producao
jwt.expiration=86400000
